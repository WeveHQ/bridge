services:
  verifier:
    image: python:3.12-alpine
    environment:
      WEVE_BRIDGE_EDGE_TOKEN: simulated-edge-token
      WEVE_BRIDGE_HUB_TOKEN_VERIFIER_SECRET: verifier-secret
      WEVE_BRIDGE_HUB_VERIFIER_BRIDGE_ID: bridge_123
      WEVE_BRIDGE_HUB_VERIFIER_TENANT_ID: simulated_tenant
    volumes:
      - ../verifier.py:/app/verifier.py:ro
    command: ["python", "/app/verifier.py"]
    networks: [control]
  hub:
    platform: ${TLS_LAB_PLATFORM:-linux/amd64}
    build:
      context: ../..
    command: ["hub", "--listen=:8080"]
    environment:
      WEVE_BRIDGE_HUB_TOKEN_VERIFIER_URL: http://verifier:8081/verify
      WEVE_BRIDGE_HUB_TOKEN_VERIFIER_SECRET: verifier-secret
      WEVE_BRIDGE_HUB_SECRET: internal-secret
      WEVE_BRIDGE_HUB_POLL_HOLD_SECONDS: "1"
    ports: ["127.0.0.1:${TLS_LAB_HUB_PORT:-18080}:8080"]
    networks: [control]
  edge:
    platform: ${TLS_LAB_PLATFORM:-linux/amd64}
    build:
      context: ../..
    command: ["edge", "--token=simulated-edge-token", "--hub-url=http://hub:8080"]
    environment:
      WEVE_BRIDGE_EDGE_ALLOWED_HOSTS: tls-target,missing.invalid
      WEVE_BRIDGE_EDGE_HEARTBEAT_SECONDS: "1"
      WEVE_BRIDGE_EDGE_POLL_TIMEOUT_MS: "1500"
      SSL_CERT_FILE: /certs/tenant-ca.pem
    volumes: ["certs:/certs:ro"]
    depends_on:
      tls-target:
        condition: service_healthy
    networks: [control, tenant]
  tls-target:
    platform: ${TLS_LAB_PLATFORM:-linux/amd64}
    build:
      context: ../..
      dockerfile: e2e/tls-lab/Dockerfile
    volumes: ["certs:/certs"]
    ports: ["127.0.0.1:${TLS_LAB_ADMIN_PORT:-18082}:8082"]
    networks: [tenant, management]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8082/healthz"]
      interval: 1s
      timeout: 2s
      retries: 20
networks:
  control: {}
  management: {}
  tenant:
    internal: true
volumes:
  certs: {}
